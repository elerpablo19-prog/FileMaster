# JVM do Gradle: heap generoso para compilar Kotlin/Compose
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Obrigatório para dependências AndroidX (Compose, Navigation, Lifecycle…)
android.useAndroidX=true

# Gera R por módulo (mais rápido)
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
