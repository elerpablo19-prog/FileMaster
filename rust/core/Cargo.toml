[package]
name = "filemaster-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Core em Rust para o FileMaster: I/O de sistema de arquivos, busca e operações assíncronas."

[lib]
name = "filemaster"
crate-type = ["cdylib", "lib"]

[dependencies]
# UniFFI: geração automática de bindings Kotlin (proc-macro, sem UDL)
uniffi = { version = "0.29", features = ["cli", "tokio"] }

# Runtime assíncrono para operações pesadas em background
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Travessia de diretórios (busca recursiva, cópia em árvore)
walkdir = "2"

# Erros ergonômicos
thiserror = "1"

# Espaço em disco (statvfs) — funciona em Android/Linux
nix = { version = "0.29", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Metadados do UniFFI (nome da crate usado no scaffolding)
[package.metadata.uniffi]
name = "filemaster"
