name: build-apk

# Gera o APK do FileMaster em qualquer push (e manualmente via workflow_dispatch).
# O APK aparece em: aba "Actions" → run → "Artifacts" → app-debug.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Java 17 (AGP 8.x)
      # ------------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------------
      # Android SDK/NDK — o runner ubuntu-latest já vem com ambos instalados
      # ------------------------------------------------------------------
      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK detectado: $NDK_DIR"

      # ------------------------------------------------------------------
      # Rust + targets Android + cargo-ndk
      # ------------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/core/Cargo.lock', 'rust/core/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Gradle (sem wrapper no repo, o setup-gradle provisiona automaticamente)
      # ------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (Rust + UniFFI bindings + Kotlin/Compose)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------
  # Ao marcar uma tag (ex.: v0.1.0), publica o APK como release anexado.
  # --------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: FileMaster-debug-apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          draft: true
